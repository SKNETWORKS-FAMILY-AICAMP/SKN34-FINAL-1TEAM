name: Security

# 새 보안 취약점과 위험한 의존성을 PR 단계에서 탐지한다. 배포는 수행하지 않는다.
on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]
  merge_group:
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: CodeQL 초기화
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: CodeQL 분석 및 결과 등록
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 신규 의존성 취약점 검사
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
