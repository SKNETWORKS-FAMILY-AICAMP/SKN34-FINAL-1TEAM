version: 2
updates:
  # 불필요한 버전 업데이트 PR은 만들지 않는다. 취약점 보안 업데이트는 계속 허용한다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  # pnpm은 npm 생태계로 관리하고, 보안 패치만 묶어서 제안한다.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
